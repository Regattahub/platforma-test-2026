<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RegattaHub TEST DIRECT EIO 04</title>
  <style>
    html,body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#0d5e92;
      font-family:Arial,Helvetica,sans-serif;
    }
    #raceFrame{
      display:block;
      width:100%;
      height:100%;
      border:0;
      background:#0d5e92;
    }
    #bridgeBadge{
      position:fixed;
      right:10px;
      bottom:10px;
      z-index:999999;
      padding:7px 10px;
      border-radius:8px;
      background:rgba(20,58,99,.94);
      color:#fff;
      font-size:12px;
      font-weight:800;
      box-shadow:0 2px 10px rgba(0,0,0,.25);
      pointer-events:none;
    }
    #bridgeBadge.ok{background:rgba(31,111,67,.95)}
    #bridgeBadge.bad{background:rgba(176,0,32,.95)}
  
/* DIRECT EIO 04 · guided popup */
#rhEioGuideOverlay{
  position:fixed;inset:0;z-index:2147483000;
  background:rgba(7,26,45,.74);
  display:none;align-items:center;justify-content:center;
  padding:18px;
}
#rhEioGuideOverlay.rh-show{display:flex}
#rhEioGuideModal{
  width:min(720px,96vw);max-height:92vh;overflow:auto;
  background:#fff;border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.32);
  font-family:Arial,Helvetica,sans-serif;color:#17324a;
}
#rhEioGuideHead{
  background:#0d5e92;color:#fff;padding:18px 22px;
  font-weight:900;font-size:22px;line-height:1.25;
  border-radius:18px 18px 0 0;
}
#rhEioGuideBody{padding:20px 22px}
.rhGuideIntro{font-size:16px;line-height:1.5;margin-bottom:14px}
.rhGuideSteps{
  display:grid;grid-template-columns:1fr;gap:9px;margin:14px 0 16px
}
.rhGuideStep{
  display:flex;gap:10px;align-items:flex-start;
  background:#f4f8fb;border:1px solid #d7e4ee;border-radius:10px;
  padding:10px 12px;font-size:15px;line-height:1.4
}
.rhGuideNum{
  flex:0 0 28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#0d5e92;color:#fff;font-weight:900
}
#rhBrowserDemo{
  position:relative;margin:16px 0 14px;
  border:1px solid #cad9e4;border-radius:12px;overflow:hidden;
  background:#f7fafc;
}
.rhDemoBar{
  height:48px;background:#e9eef3;border-bottom:1px solid #ccd8e1;
  display:flex;align-items:center;gap:8px;padding:7px 10px
}
.rhDot{width:10px;height:10px;border-radius:50%;background:#a8b4bf}
.rhAddr{
  flex:1;height:28px;background:#fff;border:1px solid #ccd8e1;
  border-radius:7px;display:flex;align-items:center;padding:0 10px;
  font-size:12px;color:#61788a;overflow:hidden
}
.rhFavBar{
  height:44px;background:#fff;border-bottom:1px solid #d7e0e7;
  display:flex;align-items:center;padding:6px 10px;gap:8px
}
.rhFav{
  position:relative;display:inline-flex;align-items:center;
  background:#198754;color:#fff;font-weight:900;
  border-radius:8px;padding:8px 12px;font-size:13px
}
.rhPulse{
  animation:rhPulse 1.6s ease-in-out infinite;
  box-shadow:0 0 0 0 rgba(25,135,84,.45)
}
@keyframes rhPulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(25,135,84,.45)}
  55%{transform:scale(1.05);box-shadow:0 0 0 14px rgba(25,135,84,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(25,135,84,0)}
}
.rhDemoPage{
  height:150px;background:linear-gradient(#ffffff,#f7fbfe);
  padding:18px;position:relative
}
.rhSearchMock{
  width:70%;max-width:420px;height:40px;border:2px solid #bfcbd5;
  border-radius:7px;background:#fff;margin:12px auto 8px
}
.rhSearchBtnMock{
  width:130px;height:34px;border-radius:7px;background:#0d5e92;
  color:#fff;font-size:12px;font-weight:900;
  display:flex;align-items:center;justify-content:center;margin:0 auto
}
.rhArrow{
  position:absolute;top:50px;left:56px;
  font-size:36px;line-height:1;
  animation:rhArrowMove 1.6s ease-in-out infinite;
}
@keyframes rhArrowMove{
  0%,100%{transform:translateY(12px) rotate(-35deg);opacity:.45}
  50%{transform:translateY(-4px) rotate(-35deg);opacity:1}
}
.rhGuideNote{
  background:#fff7d8;border:1px solid #e7cc65;color:#594800;
  border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.4
}
.rhGuideActions{
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  margin-top:18px
}
.rhGuideBtn{
  border:0;border-radius:9px;padding:12px 18px;
  font-size:15px;font-weight:900;cursor:pointer
}
#rhGuideCancel{background:#e9eef3;color:#294356}
#rhGuideOpen{background:#198754;color:#fff}
@media(max-width:560px){
  #rhEioGuideHead{font-size:19px}
  #rhEioGuideBody{padding:16px}
  .rhGuideActions{flex-direction:column-reverse}
  .rhGuideBtn{width:100%}
}

</style>
</head>
<body>
  <iframe id="raceFrame" title="RegattaHub TEST"></iframe>
  <div id="bridgeBadge">DIRECT EIO 04 · φόρτωση…</div>

<script>
(() => {
  const frame = document.getElementById("raceFrame");
  const badge = document.getElementById("bridgeBadge");

  function setBadge(text, cls) {
    badge.textContent = text;
    badge.className = cls || "";
  }

  function buildIndexUrl() {
    const u = new URL("index.html", window.location.href);

    // Περνάμε τυχόν race/settings παραμέτρους και στο πραγματικό TEST index.
    const here = new URL(window.location.href);
    here.searchParams.forEach((value, key) => {
      u.searchParams.set(key, value);
    });

    u.searchParams.set("directEioTest", "04");
    return u.href;
  }

  function installBridgeIntoRace() {
    try {
      const w = frame.contentWindow;
      if (!w || !w.document) {
        setBadge("DIRECT EIO 04 · δεν άνοιξε το TEST", "bad");
        return;
      }

      // Η έγχυση γίνεται ΜΕΣΑ στο ίδιο το TEST window ώστε το window.open()
      // να έχει ως opener το RegattaHub TEST και όχι το εξωτερικό wrapper.
      w.eval(String.raw`
(() => {
  if (window.__RH_DIRECT_EIO_04_INSTALLED__) return;
  window.__RH_DIRECT_EIO_04_INSTALLED__ = true;

  const RH_DIRECT_BOOKMARKLET = "javascript:(()=>{try{ if(!/^https:\\\\/\\\\/(www\\\\.)?eio\\\\.gr\\\\//i.test(location.href)){alert(\"Ανοίξτε πρώτα το Μητρώο Αθλητών της ΕΙΟ.\");return;} const clean=s=>String(s||\"\").replace(/\\\\u00a0/g,\" \").replace(/[ \\\\t]+\\\\n/g,\"\\\\n\").replace(/\\\\n{3,}/g,\"\\\\n\\\\n\").trim(); const bodyText=clean(document.body?.innerText||\"\"); const hasTableResult=[...document.querySelectorAll(\"table tr\")].some(tr=>tr.querySelectorAll(\"td\").length>=6); const hasSingleResult=/Αποτέλεσμα Αναζήτησης/i.test(bodyText)&&/(^|\\\\n)\\\\s*ΑΜ\\\\s*:?\\\\s*\\\\d{3,}/im.test(bodyText); if(hasTableResult||hasSingleResult){ if(!window.opener||window.opener.closed){alert(\"Η σελίδα RegattaHub δεν είναι πλέον ανοιχτή.\");return;} const payload={schema:7,source:\"EIO_BOOKMARKLET\",pageUrl:location.href,pageTitle:document.title,capturedAt:new Date().toISOString(),text:bodyText,html:document.documentElement?.outerHTML||\"\"}; window.opener.postMessage({source:\"REGATTAHUB_EIO_BOOKMARKLET\",type:\"EIO_CAPTURE\",payload},\"*\"); try{window.opener.focus();}catch(e){} alert(\"✓ Τα στοιχεία στάλθηκαν στο RegattaHub.\"); return; } const params=new URLSearchParams((location.hash||\"\").replace(/^#/,\"\")); const raw=params.get(\"rh\")||\"\"; const ids=raw.split(\",\").map(x=>x.trim()).filter(Boolean); if(ids.length){ const input=document.querySelector('input[name=\"search_term\"]')||document.querySelector('input[type=\"text\"]'); if(!input){alert(\"Δεν βρέθηκε το πεδίο αναζήτησης της ΕΙΟ.\");return;} input.focus(); input.value=ids.join(\",\"); input.dispatchEvent(new Event(\"input\",{bubbles:true})); input.dispatchEvent(new Event(\"change\",{bubbles:true})); alert(\"✓ Ο ΑΜ μπήκε στο πεδίο της ΕΙΟ.\\\\nΠατήστε τώρα «Αναζήτηση».\"); return; } if(!window.opener||window.opener.closed){alert(\"Ανοίξτε την ΕΙΟ από το RegattaHub και δοκιμάστε ξανά.\");return;} let finished=false; const handler=(ev)=>{ const d=ev.data||{}; if(d.source!==\"REGATTAHUB_QUICKCHECK\"||d.type!==\"EIO_CARDS\") return; window.removeEventListener(\"message\",handler); finished=true; const got=Array.isArray(d.cards)?d.cards.filter(Boolean):[]; if(!got.length){alert(\"Δεν βρέθηκαν ΑΜ στο RegattaHub.\");return;} const input=document.querySelector('input[name=\"search_term\"]')||document.querySelector('input[type=\"text\"]'); if(!input){alert(\"Δεν βρέθηκε το πεδίο αναζήτησης της ΕΙΟ.\");return;} input.focus(); input.value=got.join(\",\"); input.dispatchEvent(new Event(\"input\",{bubbles:true})); input.dispatchEvent(new Event(\"change\",{bubbles:true})); alert(\"✓ Ο ΑΜ μπήκε στο πεδίο της ΕΙΟ.\\\\nΠατήστε τώρα «Αναζήτηση».\"); }; window.addEventListener(\"message\",handler); window.opener.postMessage({source:\"REGATTAHUB_EIO_BOOKMARKLET\",type:\"REQUEST_CARDS\"},\"*\"); setTimeout(()=>{if(finished)return;window.removeEventListener(\"message\",handler);alert(\"Δεν βρέθηκαν οι ΑΜ. Επιστρέψτε στο RegattaHub και ανοίξτε ξανά την ΕΙΟ.\");},1800); }catch(e){alert(\"Δεν ολοκληρώθηκε η ενέργεια. \"+(e&&e.message?e.message:e));}})();";

  function normalizeTarget(target) {
    if (target === "secondCaptain") return "secondCaptain";
    if (target === "crew") return "crew";
    return "captain";
  }

  function getIdsForTarget(target) {
    target = normalizeTarget(target);

    if (target === "captain") {
      return [String(document.getElementById("captainCardInput")?.value || "").replace(/\D/g,"").trim()].filter(Boolean);
    }

    if (target === "secondCaptain") {
      return [String(document.getElementById("secondCaptainCardInput")?.value || "").replace(/\D/g,"").trim()].filter(Boolean);
    }

    const raw = String(document.getElementById("bulkCrewCards")?.value || "");
    return [...new Set(raw.split(/[\s,;]+/).map(x => x.replace(/\D/g,"").trim()).filter(Boolean))];
  }

  function prepareUserFields() {
    const captain = document.getElementById("captainCardInput");
    if (captain) {
      captain.readOnly = false;
      captain.placeholder = "Γράψτε ΑΜ π.χ. 19012";
      captain.setAttribute("aria-label", "Αριθμός Μητρώου ΕΙΟ κυβερνήτη");
      captain.style.background = "#ffffff";
    }

    const crew = document.getElementById("bulkCrewCards");
    if (crew) {
      crew.readOnly = false;
      crew.placeholder = "Γράψτε τους ΑΜ πληρώματος, έναν ανά γραμμή";
      crew.setAttribute("aria-label", "Αριθμοί Μητρώου ΕΙΟ πληρώματος");
      crew.style.background = "#ffffff";
    }
  }

  function installBookmarkGuide() {
    if (document.getElementById("rhDirectBookmarkGuide")) return;

    const crewScreen = document.getElementById("crewScreen");
    if (!crewScreen) return;

    const box = document.createElement("div");
    box.id = "rhDirectBookmarkGuide";
    box.style.cssText =
      "margin:0 auto 22px auto;padding:16px 18px;max-width:650px;" +
      "background:#eef8f1;border:2px solid #198754;border-radius:10px;" +
      "text-align:center;line-height:1.5;color:#173b2a;";

    box.innerHTML =
      '<div style="font-weight:900;font-size:17px;margin-bottom:8px;">ΠΡΩΤΗ ΧΡΗΣΗ · ΜΙΑ ΦΟΡΑ ΜΟΝΟ</div>' +
      '<div style="margin-bottom:10px;">Αν δεν βλέπετε τη γραμμή Σελιδοδεικτών, πατήστε <b>Ctrl + Shift + B</b>.</div>' +
      '<div style="margin-bottom:10px;">Σύρετε το πράσινο κουμπί στη γραμμή Σελιδοδεικτών:</div>' +
      '<a id="rhDirectBookmark" href="#" draggable="true" ' +
      'style="display:inline-block;background:#198754;color:#fff;text-decoration:none;' +
      'font-weight:900;font-size:16px;padding:12px 18px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.16);">' +
      'RegattaHub · Μεταφορά</a>' +
      '<div style="font-size:13px;margin-top:10px;color:#446254;">Μετά δεν χρειάζεται να το ξανακάνετε.</div>';

    crewScreen.insertBefore(box, crewScreen.firstChild);

    const link = box.querySelector("#rhDirectBookmark");
    link.setAttribute("href", RH_DIRECT_BOOKMARKLET);
  }


  let rhPendingEioTarget = "captain";

  function ensureEioGuideModal() {
    if (document.getElementById("rhEioGuideOverlay")) return;

    const overlay = document.createElement("div");
    overlay.id = "rhEioGuideOverlay";
    overlay.innerHTML = "\n      <div id=\"rhEioGuideModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rhEioGuideHead\">\n        <div id=\"rhEioGuideHead\">Πριν ανοίξει η ΕΙΟ</div>\n        <div id=\"rhEioGuideBody\">\n          <div class=\"rhGuideIntro\">\n            Στην επόμενη σελίδα θα χρησιμοποιήσετε το αγαπημένο\n            <b>RegattaHub · Μεταφορά</b>. Η σειρά είναι πάντα η ίδια:\n          </div>\n\n          <div class=\"rhGuideSteps\">\n            <div class=\"rhGuideStep\">\n              <div class=\"rhGuideNum\">1</div>\n              <div>Πατήστε <b>RegattaHub · Μεταφορά</b> από τη γραμμή Σελιδοδεικτών. Ο ΑΜ θα συμπληρωθεί μόνος του.</div>\n            </div>\n            <div class=\"rhGuideStep\">\n              <div class=\"rhGuideNum\">2</div>\n              <div>Πατήστε <b>Αναζήτηση</b> στη σελίδα της ΕΙΟ.</div>\n            </div>\n            <div class=\"rhGuideStep\">\n              <div class=\"rhGuideNum\">3</div>\n              <div>Όταν εμφανιστούν τα στοιχεία, πατήστε ξανά <b>RegattaHub · Μεταφορά</b>.</div>\n            </div>\n          </div>\n\n          <div id=\"rhBrowserDemo\" aria-hidden=\"true\">\n            <div class=\"rhDemoBar\">\n              <span class=\"rhDot\"></span><span class=\"rhDot\"></span><span class=\"rhDot\"></span>\n              <div class=\"rhAddr\">https://eio.gr/clubs/get_player.php</div>\n            </div>\n            <div class=\"rhFavBar\">\n              <span class=\"rhFav rhPulse\">RegattaHub · Μεταφορά</span>\n            </div>\n            <div class=\"rhDemoPage\">\n              <div class=\"rhArrow\">⬆</div>\n              <div class=\"rhSearchMock\"></div>\n              <div class=\"rhSearchBtnMock\">Αναζήτηση</div>\n            </div>\n          </div>\n\n          <div class=\"rhGuideNote\">\n            Δεν βλέπετε τη γραμμή Σελιδοδεικτών; Πατήστε <b>Ctrl + Shift + B</b>.\n          </div>\n\n          <div class=\"rhGuideActions\">\n            <button id=\"rhGuideCancel\" class=\"rhGuideBtn\" type=\"button\">ΑΚΥΡΩΣΗ</button>\n            <button id=\"rhGuideOpen\" class=\"rhGuideBtn\" type=\"button\">ΤΟ ΚΑΤΑΛΑΒΑ · ΑΝΟΙΓΜΑ ΕΙΟ</button>\n          </div>\n        </div>\n      </div>";

    document.body.appendChild(overlay);

    overlay.addEventListener("click", (ev) => {
      if (ev.target === overlay) overlay.classList.remove("rh-show");
    });

    overlay.querySelector("#rhGuideCancel").addEventListener("click", () => {
      overlay.classList.remove("rh-show");
    });

    overlay.querySelector("#rhGuideOpen").addEventListener("click", () => {
      overlay.classList.remove("rh-show");
      openEioDirectNow(rhPendingEioTarget);
    });
  }

  function showEioGuide(target) {
    rhPendingEioTarget = normalizeTarget(target);
    ensureEioGuideModal();
    document.getElementById("rhEioGuideOverlay").classList.add("rh-show");
  }

  function openEioDirectNow(target) {
    const normalized = normalizeTarget(target);
    try { if (typeof setEioImportTarget_ === "function") setEioImportTarget_(normalized); } catch (_) {}

    const ids = getIdsForTarget(normalized);

    if (!ids.length) {
      const label = normalized === "crew" ? "τους ΑΜ του πληρώματος" :
                    normalized === "secondCaptain" ? "τον ΑΜ του δεύτερου κυβερνήτη" :
                    "τον ΑΜ του κυβερνήτη";
      alert("Γράψτε πρώτα " + label + " στη φόρμα RegattaHub.");
      return null;
    }

    const url = "https://eio.gr/clubs/get_player.php#rh=" + encodeURIComponent(ids.join(","));
    const popup = window.open(url, "rhEioDirect");

    if (!popup) {
      alert("Ο browser εμπόδισε το άνοιγμα της ΕΙΟ. Επιτρέψτε τα αναδυόμενα παράθυρα και δοκιμάστε ξανά.");
      return null;
    }

    try { popup.focus(); } catch (_) {}
    return popup;
  }


  function openEioDirect(target) {
    showEioGuide(target);
    return null;
  }

  // DIRECT FLOW: φόρμα -> ΕΙΟ -> ίδια φόρμα. Χωρίς Quick Check.
  window.openEioAthleteRegistry = function(target) {
    return openEioDirect(target || "captain");
  };

  window.startCrewEio = function() {
    try { if (typeof setEioImportTarget_ === "function") setEioImportTarget_("crew"); } catch (_) {}
    return openEioDirect("crew");
  };

  // Δεύτερος κυβερνήτης: για το DIRECT TEST ζητάμε πρώτα ΑΜ στην ίδια φόρμα.
  window.startSecondCaptainEio = function() {
    try { if (typeof setEioImportTarget_ === "function") setEioImportTarget_("secondCaptain"); } catch (_) {}

    const section = document.getElementById("secondCaptainSection");
    const buttonBox = document.getElementById("addSecondCaptainBox");
    const input = document.getElementById("secondCaptainCardInput");

    if (section) section.style.display = "block";
    if (buttonBox) buttonBox.style.display = "none";

    if (input) {
      const holder = input.parentElement;
      if (holder) holder.style.display = "block";
      input.readOnly = false;
      input.placeholder = "Γράψτε ΑΜ 2ου κυβερνήτη";
      input.style.cssText =
        "height:48px;width:220px;max-width:100%;font-size:18px;font-weight:700;" +
        "text-align:center;color:#143a63;background:#fff;border:2px solid #0d5e92;" +
        "border-radius:7px;box-shadow:0 0 0 3px rgba(13,94,146,.10);outline:none;margin:8px auto 12px;";
    }

    if (!document.getElementById("rhSecondCaptainSearchBtn") && section) {
      const btn = document.createElement("button");
      btn.id = "rhSecondCaptainSearchBtn";
      btn.className = "btn";
      btn.type = "button";
      btn.textContent = "ΑΝΑΖΗΤΗΣΗ 2ου ΚΥΒΕΡΝΗΤΗ ΣΤΗΝ ΕΙΟ";
      btn.addEventListener("click", () => openEioDirect("secondCaptain"));
      section.insertBefore(btn, section.querySelector(".personStatus"));
    }

    if (input) input.focus();
  };

  // Παραλαβή απευθείας από το bookmarklet της ΕΙΟ.
  window.addEventListener("message", function(event) {
    if (event.origin !== "https://eio.gr" && event.origin !== "https://www.eio.gr") return;

    const d = event.data || {};
    if (d.source !== "REGATTAHUB_EIO_BOOKMARKLET") return;
    if (d.type !== "EIO_CAPTURE") return;

    if (typeof rhEioImport_ !== "function") {
      alert("Το RegattaHub παρέλαβε τα στοιχεία, αλλά δεν βρέθηκε η λειτουργία εισαγωγής.");
      return;
    }

    rhEioImport_(d.payload || {});
  });

  prepareUserFields();
  installBookmarkGuide();
  ensureEioGuideModal();

  const observer = new MutationObserver(() => {
    prepareUserFields();
    installBookmarkGuide();
  });
  observer.observe(document.documentElement, {childList:true,subtree:true});

  console.log("RegattaHub DIRECT EIO 04 installed");
})();
      `);

      setBadge("DIRECT EIO 04 · ΕΝΕΡΓΟ", "ok");
    } catch (err) {
      console.error(err);
      setBadge("DIRECT EIO 04 · ΣΦΑΛΜΑ", "bad");
      alert(
        "Δεν ενεργοποιήθηκε το DIRECT EIO 04.\\n\\n" +
        (err && err.message ? err.message : String(err))
      );
    }
  }

  let directInstalled = false;

  function tryInstallDirect() {
    if (directInstalled) return;
    try {
      const w = frame.contentWindow;
      const d = w && w.document;
      if (!w || !d || !d.documentElement) return;

      // Περιμένουμε να έχει αρχίσει να φορτώνεται πραγματικά το index.html.
      if (!String(w.location.href || "").includes("index.html")) return;

      installBridgeIntoRace();

      try {
        directInstalled = !!w.__RH_DIRECT_EIO_04_INSTALLED__;
      } catch (_) {
        directInstalled = false;
      }

      if (directInstalled) {
        setBadge("DIRECT EIO 04 · ΕΝΕΡΓΟ", "ok");
      }
    } catch (_) {
      // Αν το frame είναι ακόμη σε about:blank, ξαναδοκιμάζουμε.
    }
  }

  frame.addEventListener("load", () => {
    setTimeout(tryInstallDirect, 150);
    setTimeout(tryInstallDirect, 600);
  });

  frame.src = buildIndexUrl();

  // Δεν βασιζόμαστε μόνο στο load event.
  const retryTimer = setInterval(() => {
    tryInstallDirect();
    if (directInstalled) clearInterval(retryTimer);
  }, 500);

  setTimeout(() => {
    if (!directInstalled) {
      setBadge("DIRECT EIO 04 · αναμονή TEST…");
    }
  }, 5000);
})();
</script>
</body>
</html>

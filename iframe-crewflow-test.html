<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RegattaHub · TEST Εισαγωγή Πληρώματος</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d5e92;font-family:Arial,Helvetica,sans-serif}
#raceFrame{display:block;width:100%;height:100%;border:0;background:#0d5e92}
#badge{position:fixed;right:10px;bottom:10px;z-index:999999;padding:7px 10px;border-radius:8px;background:rgba(20,58,99,.94);color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#badge.ok{background:rgba(31,111,67,.95)}#badge.bad{background:rgba(176,0,32,.95)}
</style>
</head>
<body>
<iframe id="raceFrame" title="RegattaHub TEST"></iframe>
<div id="badge">CREW IMPORT 01 · φόρτωση…</div>
<script>
(function(){
  const frame=document.getElementById('raceFrame');
  const badge=document.getElementById('badge');
  function setBadge(t,c){badge.textContent=t;badge.className=c||'';}
  function readPayload(){try{const p=JSON.parse(localStorage.getItem('rh_eio_crew_payload_v1')||'null');if(p&&Array.isArray(p.records)&&p.records.length)return p;}catch(_){}return null;}
  function cleanName(v){return String(v||'').replace(/\bδιαγραφή\b/gi,'').replace(/\(\s*ΚΥΒΕΡΝΗΤΗΣ\s*\)/gi,'').replace(/\s+/g,' ').trim();}
  function inject(){
    const p=readPayload(); if(!p){setBadge('CREW IMPORT 01 · δεν βρέθηκαν δεδομένα','bad');return;}
    const w=frame.contentWindow; if(!w||!w.document){setBadge('CREW IMPORT 01 · δεν άνοιξε το TEST','bad');return;}
    try{
      const doc=w.document;
      if(typeof w.showCrewScreen==='function') w.showCrewScreen();
      const captain=p.records.find(r=>r&&r.isCaptain)||p.records[0];
      const crew=p.records.filter(r=>r&&r!==captain);

      const capInput=doc.getElementById('captainCardInput');
      if(capInput&&captain){
        capInput.value=String(captain.card||''); capInput.readOnly=true;
        let box=capInput.closest('div')||capInput.parentElement;
        let n=box&&box.querySelector('.name'), cl=box&&box.querySelector('.club'), st=box&&box.querySelector('.personStatus');
        if(n)n.textContent=cleanName(captain.name); if(cl)cl.textContent=String(captain.club||'');
        if(st){st.textContent='✔ Μεταφέρθηκε από ΕΙΟ';st.style.color='#2e7d32';}
      }

      const crewSection=doc.getElementById('crewSection'); if(crewSection) crewSection.style.display='block';
      const crewList=doc.getElementById('crewList'); if(crewList) crewList.innerHTML='';
      const bulk=doc.getElementById('bulkCrewCards'); if(bulk) bulk.value=crew.map(r=>String(r.card||'')).filter(Boolean).join('\n');

      crew.forEach(function(r){
        if(typeof w.addCrewMember!=='function') return;
        w.addCrewMember();
        const rows=doc.querySelectorAll('#crewTable tbody tr'); const tr=rows[rows.length-1]; if(!tr)return;
        const input=tr.querySelector('input'); if(input){input.value=String(r.card||'');input.readOnly=true;}
        const n=tr.querySelector('.name'),cl=tr.querySelector('.club'),st=tr.querySelector('.personStatus');
        if(n)n.textContent=cleanName(r.name); if(cl)cl.textContent=String(r.club||'');
        if(st){st.textContent='✔ Μεταφέρθηκε από ΕΙΟ';st.style.color='#2e7d32';}
      });

      if(typeof w.renumberCrewRows==='function') w.renumberCrewRows();
      if(typeof w.refreshWosrSelectors==='function') w.refreshWosrSelectors();
      const btn=doc.getElementById('continueToJotformBtn'); if(btn&&crew.length)btn.style.display='inline-block';

      const screen=doc.getElementById('crewScreen');
      if(screen&&!doc.getElementById('rhImportedCrewNotice')){
        const box=doc.createElement('div');box.id='rhImportedCrewNotice';
        box.style.cssText='max-width:720px;margin:0 auto 18px;padding:14px 16px;background:#eef9f1;border:2px solid #2e8b57;border-radius:10px;color:#185c36;font-weight:800;text-align:center;line-height:1.45;';
        box.innerHTML='✓ Μεταφέρθηκαν <b>'+p.records.length+'</b> μέλη από τη Δήλωση Αθλητών της ΕΙΟ.<br>Ο κυβερνήτης και το πλήρωμα έχουν τοποθετηθεί στη φόρμα RegattaHub.';
        screen.insertBefore(box,screen.firstChild);
      }
      setBadge('CREW IMPORT 01 · ΕΝΕΡΓΟ','ok');
      setTimeout(()=>{if(screen)screen.scrollIntoView({behavior:'smooth',block:'start'});},250);
    }catch(e){console.error(e);setBadge('CREW IMPORT 01 · σφάλμα','bad');alert('Δεν ολοκληρώθηκε η δοκιμαστική εισαγωγή: '+(e&&e.message?e.message:e));}
  }
  frame.addEventListener('load',()=>setTimeout(inject,700));
  const u=new URL('index.html',location.href);u.searchParams.set('crewImportTest','01');frame.src=u.href;
})();
</script>
</body>
</html>

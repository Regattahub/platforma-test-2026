<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RegattaHub — Επιστροφή πληρώματος</title><style>body{font:17px Arial,sans-serif;background:#eaf1f7;color:#153b59;display:grid;place-items:center;min-height:90vh}.box{background:#fff;padding:25px;border-radius:12px;max-width:640px}</style></head><body><div class="box" id="status">Μεταφορά πληρώματος στο RegattaHub…</div><script>(function(){try{const m=(location.hash||'').match(/(?:^#|&)rhcrew=([^&]+)/);if(!m)throw Error('Δεν βρέθηκαν στοιχεία. Ανοίξτε τη δήλωση πληρώματος της ΕΙΟ και πατήστε το αγαπημένο.');let token=m[1].replace(/-/g,'+').replace(/_/g,'/');while(token.length%4)token+='=';const p=JSON.parse(decodeURIComponent(escape(atob(token))));if(!p||!Array.isArray(p.records)||!p.records.length)throw Error('Δεν βρέθηκαν μέλη πληρώματος.');if(p.source!=='OFFSHORE_CREWLIST')throw Error('Μη αναγνωρισμένη πηγή στοιχείων.');localStorage.setItem('rh_eio_crew_payload_v1',JSON.stringify(p));history.replaceState(null,'',location.pathname);location.replace('index_TEST_EIO_CONSENT_JOTFORM_20261009.html?imported=1');}catch(e){document.getElementById('status').textContent='Δεν ολοκληρώθηκε η μεταφορά: '+e.message;}})();</script></body></html>

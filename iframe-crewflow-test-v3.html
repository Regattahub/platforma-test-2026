<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RegattaHub · TEST Εισαγωγή Πληρώματος</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d5e92;font-family:Arial,Helvetica,sans-serif}
#raceFrame{display:block;width:100%;height:100%;border:0;background:#0d5e92}
#badge{
  position:fixed;right:10px;bottom:10px;z-index:999999;
  padding:7px 10px;border-radius:8px;background:rgba(20,58,99,.94);
  color:#fff;font-size:12px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.25)
}
#badge.ok{background:rgba(31,111,67,.95)}
#badge.bad{background:rgba(176,0,32,.95)}
</style>
</head>
<body>
<iframe id="raceFrame" title="RegattaHub TEST"></iframe>
<div id="badge">CREW IMPORT 03 · φόρτωση…</div>

<script>
(function(){
  const frame=document.getElementById("raceFrame");
  const badge=document.getElementById("badge");

  function setBadge(t,c){badge.textContent=t;badge.className=c||"";}

  function readPayload(){
    try{
      const p=JSON.parse(localStorage.getItem("rh_eio_crew_payload_v1")||"null");
      if(p && Array.isArray(p.records) && p.records.length) return p;
    }catch(_){}
    return null;
  }

  function cleanName(v){
    return String(v||"")
      .replace(/\bδιαγραφή\b/gi,"")
      .replace(/\(\s*ΚΥΒΕΡΝΗΤΗΣ\s*\)/gi,"")
      .replace(/\s+/g," ")
      .trim();
  }

  function hide(el){ if(el) el.style.display="none"; }
  function show(el,display){ if(el) el.style.display=display||"block"; }

  function forceCrewScreen(w,doc){
    hide(doc.querySelector(".hero"));
    hide(doc.querySelector(".separator"));
    hide(doc.getElementById("eventTitle"));
    hide(doc.querySelector(".notice-box"));
    hide(doc.querySelector(".search-area"));
    hide(doc.getElementById("status"));
    hide(doc.getElementById("resultCard"));
    hide(doc.getElementById("actions"));
    hide(doc.getElementById("eioTestWrap"));
    hide(doc.getElementById("eioConfirmBox"));
    hide(doc.getElementById("formWrap"));

    show(doc.getElementById("crewScreen"),"block");
    show(doc.getElementById("crewSection"),"block");

    try{ w.scrollTo({top:0,behavior:"auto"}); }catch(_){}
  }

  function fillCaptain(doc,captain){
    if(!captain) return;
    const screen=doc.getElementById("crewScreen");
    const input=doc.getElementById("captainCardInput");
    if(input){
      input.value=String(captain.card||"");
      input.readOnly=true;
    }

    const statusEl=screen ? screen.querySelector(".personStatus") : null;
    const nameEl=screen ? screen.querySelector(".name") : null;
    const clubEl=screen ? screen.querySelector(".club") : null;
    const cardEl=screen ? screen.querySelector(".cardNumber") : null;

    if(statusEl){
      statusEl.textContent="✔ Μεταφέρθηκε από τη Δήλωση ΕΙΟ";
      statusEl.style.color="#2e7d32";
    }
    if(nameEl) nameEl.textContent=cleanName(captain.name);
    if(clubEl) clubEl.textContent=String(captain.club||"").trim();
    if(cardEl) cardEl.textContent=String(captain.card||"");

    hide(doc.getElementById("openEioCaptainBtn"));

    if(screen){
      const labels=[...screen.querySelectorAll("label")];
      const captainLabel=labels.find(x=>/Αναζητήστε τον κυβερνήτη/i.test(x.textContent||""));
      if(captainLabel) captainLabel.textContent="Στοιχεία κυβερνήτη από τη Δήλωση Αθλητών της ΕΙΟ";
    }
  }

  function fillCrew(w,doc,crew){
    const section=doc.getElementById("crewSection");
    if(!section) return;
    show(section,"block");

    const oldBtn=[...section.querySelectorAll("button")].find(b=>/ΑΝΑΖΗΤΗΣΗ ΠΛΗΡΩΜΑΤΟΣ ΣΤΗΝ ΕΙΟ/i.test(b.textContent||""));
    hide(oldBtn);

    const intro=[...section.querySelectorAll("div")].find(d=>/Αναζητήστε τα δελτία του πληρώματος/i.test(d.textContent||""));
    if(intro) intro.textContent="Τα στοιχεία πληρώματος μεταφέρθηκαν από τη Δήλωση Αθλητών της ΕΙΟ.";

    const bulk=doc.getElementById("bulkCrewCards");
    if(bulk){
      bulk.value=crew.map(r=>String(r.card||"")).filter(Boolean).join("\n");
      bulk.style.display="none";
    }

    const crewList=doc.getElementById("crewList");
    if(crewList) crewList.innerHTML="";

    crew.forEach(function(r){
      if(typeof w.addCrewMember!=="function") return;
      w.addCrewMember();

      const rows=doc.querySelectorAll("#crewTable tbody tr");
      const tr=rows[rows.length-1];
      if(!tr) return;

      const input=tr.querySelector("input");
      if(input){
        input.value=String(r.card||"");
        input.readOnly=true;
      }

      const nameEl=tr.querySelector(".name");
      const clubEl=tr.querySelector(".club");
      const statusEl=tr.querySelector(".personStatus");

      if(nameEl) nameEl.textContent=cleanName(r.name);
      if(clubEl) clubEl.textContent=String(r.club||"").trim();
      if(statusEl){
        statusEl.textContent="✔ Μεταφέρθηκε από ΕΙΟ";
        statusEl.style.color="#2e7d32";
      }
    });

    if(typeof w.renumberCrewRows==="function") w.renumberCrewRows();
    if(typeof w.refreshWosrSelectors==="function") w.refreshWosrSelectors();

    const continueBtn=doc.getElementById("continueToJotformBtn");
    if(continueBtn && crew.length) continueBtn.style.display="inline-block";
  }


  function autoSelectFirstAid(doc,captain,crew){
    const select1=doc.getElementById("wosrMember1");
    const select2=doc.getElementById("wosrMember2");
    if(!select1 || !select2) return;

    const candidates=[];

    if(captain && captain.firstAid){
      candidates.push("captain");
    }

    crew.forEach(function(r,index){
      if(r && r.firstAid){
        candidates.push(String(index+1));
      }
    });

    select1.value=candidates[0] || "";
    select2.value=candidates[1] || "";

    // Αν υπάρχουν λιγότεροι από δύο επιβεβαιωμένοι από την ΕΙΟ,
    // αφήνουμε το υπόλοιπο πεδίο κενό για επιλογή από τον χρήστη.
    const box=doc.getElementById("wosrSelectBox");
    if(box && candidates.length) box.style.display="block";
  }

  function addNotice(doc,total){
    const screen=doc.getElementById("crewScreen");
    if(!screen || doc.getElementById("rhImportedCrewNotice")) return;

    const box=doc.createElement("div");
    box.id="rhImportedCrewNotice";
    box.style.cssText=
      "max-width:660px;margin:0 auto 18px;padding:14px 16px;" +
      "background:#eef9f1;border:2px solid #2e8b57;border-radius:10px;" +
      "color:#185c36;font-weight:800;text-align:center;line-height:1.45;";
    box.innerHTML="✓ Μεταφέρθηκαν <b>"+total+
      "</b> μέλη από τη Δήλωση Αθλητών της ΕΙΟ.<br>" +
      "Ελέγξτε τα στοιχεία και συνεχίστε στη φόρμα.";
    screen.insertBefore(box,screen.firstChild);
  }

  function inject(){
    const p=readPayload();
    if(!p){setBadge("CREW IMPORT 03 · δεν βρέθηκαν δεδομένα","bad");return;}

    const w=frame.contentWindow;
    if(!w || !w.document){setBadge("CREW IMPORT 03 · δεν άνοιξε το TEST","bad");return;}

    try{
      const doc=w.document;

      forceCrewScreen(w,doc);

      const captain=p.records.find(r=>r && r.isCaptain) || p.records[0];
      const crew=p.records.filter(r=>r && r!==captain);

      fillCaptain(doc,captain);
      fillCrew(w,doc,crew);

      // Τα dropdown WS OSR έχουν ήδη γεμίσει από τη refreshWosrSelectors().
      // Επιλέγουμε αυτόματα τα μέλη που η ΕΙΟ έχει σημειωμένα στις Πρώτες Βοήθειες.
      if(typeof w.refreshWosrSelectors==="function") w.refreshWosrSelectors();
      autoSelectFirstAid(doc,captain,crew);

      addNotice(doc,p.records.length);

      setBadge("CREW IMPORT 03 · ΕΝΕΡΓΟ","ok");

      setTimeout(function(){
        const target=doc.getElementById("crewScreen");
        if(target) target.scrollIntoView({behavior:"auto",block:"start"});
      },100);

    }catch(e){
      console.error(e);
      setBadge("CREW IMPORT 03 · σφάλμα","bad");
      alert("Δεν ολοκληρώθηκε η δοκιμαστική εισαγωγή: "+(e&&e.message?e.message:e));
    }
  }

  frame.addEventListener("load",function(){
    setTimeout(inject,700);
  });

  const u=new URL("index.html",location.href);
  u.searchParams.set("crewImportTest","03");
  frame.src=u.href;
})();
</script>
</body>
</html>
